<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>辛庄中心卫生院处方笺 A5最终定稿版</title>
<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "SimSun", "宋体";
}
body{
  background: #fff;
  padding: 16px;
}
.operation-bar{
  margin-bottom: 15px;
}
button{
  padding: 8px 16px;
  font-size:14px;
  cursor: pointer;
  margin-right: 8px;
}

/* A5处方外框 148mm × 210mm */
.pres-card{
  width:148mm;
  height:210mm;
  border:1px solid #333;
  margin:0 auto;
  padding:12mm;
  position:relative;
}

/* 顶部居中大标题 */
.pres-title{
  text-align:center;
  font-size:19px;
  font-weight:normal;
  margin-bottom:4px;
}
/* 标题下方通栏分隔线 */
.title-divider{
  width:100%;
  height:1px;
  background:#000;
  margin-bottom:10px;
}

/* 患者信息行公共基础 */
.info-line{
  font-size:14px;
  line-height:32px;
  white-space:nowrap;
}
.info-line input{
  border:none;
  border-bottom:1px solid #000;
  background:transparent;
  outline:none;
  font-size:14px;
}

/* ==========底部输入框统一样式，消除方框只保留底部横线========== */
.bottom-block input{
    border: none !important;
    border-bottom: 1px solid #000 !important;
    background: transparent;
    outline: none;
}

/* Rx上方分隔线，和标题下方横线样式完全一致 */
.rx-divider{
  width:100%;
  height:1px;
  background:#000;
  margin:16px 0 4px 0;
}

/* Rx符号 信息栏下方靠左 */
.rp-sign{
  font-size:40px;
}

/*【唯一改动处：降低最小高度，缩短中间空白区域，其余全部原样！】*/
.drug-text-area{
  font-size:14px;
  line-height:28px;
  min-height:62mm;
  white-space:pre-line;
}

/* 底部签字区域 */
.bottom-block{
  position:absolute;
  left:12mm;
  right:12mm;
  bottom:12mm;
}
.doc-line{
  font-size:14px;
  line-height:32px;
  margin-bottom:4px;
}
/* 医师签名下方通栏分隔横线 */
.doc-divider{
  width:100%;
  height:1px;
  background:#000;
  margin-bottom:6px;
}
.bottom-row{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  line-height:32px;
}

/* =========打印配置========= */
@media print{
  .operation-bar{
    display:none !important;
  }
  body{
    padding:0;
    margin:0;
  }
  @page{
    size:A5 portrait;
    margin:0mm;
  }
}
</style>
</head>
<body>
<div class="operation-bar">
  <button onclick="window.print()">🖨打印处方笺</button>
  <button onclick="clearAllDrug()">清空所有药品</button>
  <button onclick="fillTestData()">载入测试药品样本</button>
</div>

<div class="pres-card">
  <!--顶部横向居中大标题-->
  <div class="pres-title">辛庄中心卫生院一体化村卫生室专用处方笺</div>
  <div class="title-divider"></div>

  <!--第1行：保持左对齐，宽度不变-->
  <div class="info-line">
    <input style="width:70px;">乡<input style="width:70px;">村 &nbsp;&nbsp;&nbsp;电话：<input id="inp_tel" style="width:100px;">
  </div>

  <!--第2行：姓名、性别、年龄均分整行宽度 -->
  <div class="info-line" style="display:flex;justify-content:space-between;">
    <span>姓名：<input id="inp_name" style="width:110px;"></span>
    <span>性别：<input id="inp_sex" style="width:70px;"></span>
    <span>年龄：<input id="inp_age" style="width:70px;"></span>
  </div>

  <!--第3行：改用flex布局，让日期右端和上一行年龄右端对齐-->
<div class="info-line" style="display:flex; justify-content:space-between; align-items:center;">
  <span>科别：<input id="inp_dept" style="width:65px;"></span>
  <span>临床诊断：<input id="inp_diag" style="width:110px;"></span>
  <span>日期：<input id="inp_date" style="width:70px;"></span>
</div>

  <!-- Rx上方新增通长分割横线 -->
  <div class="rx-divider"></div>

  <!--靠左放置大写R-->
  <div class="rp-sign">R</div>

  <!--Rx右下方药品明细主区域-->
  <div class="drug-text-area" id="show_drug_list"></div>

  <!--底部横向布局栏-->
  <div class="bottom-block">
    <div class="doc-line">医师签名：<input style="width:220px;"></div>
    <div class="doc-divider"></div>
    <div class="bottom-row">
      <span>药品金额<input style="width:90px;"></span>
      <span>审核<input style="width:70px;"></span>
      <span>调配<input style="width:70px;"></span>
      <span>核对<input style="width:70px;"></span>
    </div>
  </div>
</div>

<script>
//登录校验
let loginInfo = localStorage.getItem("loginUser");
if(!loginInfo){
  alert("请登录系统！");
  location.href="index.html";
}

//自动填充当日日期
const now = new Date();
document.getElementById("inp_date").value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

//新增一行药品（对外接口）
function addDrugRow(content){
  const dom = document.getElementById("show_drug_list");
  dom.innerText += content + "\n";
}

//清空药品
function clearAllDrug(){
  document.getElementById("show_drug_list").innerText = "";
}

//测试数据
function fillTestData(){
  clearAllDrug();
  addDrugRow("阿奇霉素胶囊 0.25g×6粒");
  addDrugRow("2粒 每日1次 口服");
  addDrugRow("");
  addDrugRow("抗病毒口服液 10ml×10支");
  addDrugRow("1支 每日3次 口服");
}
</script>
</body>
</html>
