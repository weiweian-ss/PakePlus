<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>药品目录维护</title>
<style>
*{margin:0;padding:0;font-family:"微软雅黑"}
header{background:#225494;color:#fff;padding:14px;font-size:19px;display:flex;justify-content:space-between}
section{padding:20px;max-width:1200px;margin:0 auto}
.form-row{margin:12px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{padding:6px;border:1px solid #aaa;font-size:14px}
table{width:100%;border-collapse:collapse;margin:20px 0}
th,td{border:1px solid #999;padding:8px;text-align:center;font-size:14px}
button{padding:7px 10px;cursor:pointer;border:none;background:#225494;color:#fff;border-radius:3px;margin:0 2px}
.btn-del{background:#bb2222}
.btn-reset{background:#c27000}
.back{cursor:pointer}
</style>
</head>
<body>
<header>
<span>药品目录维护</span>
<span class="back" onclick="history.back()">返回主页</span>
</header>
<section>
<div class="form-row">
<label>药品分类</label>
<select id="drugType">
<option value="抗生素">抗生素</option>
<option value="输液">输液</option>
<option value="心血管">心血管</option>
<option value="呼吸消化">呼吸消化</option>
<option value="解热镇痛">解热镇痛</option>
<option value="内分泌">内分泌</option>
<option value="外用">外用</option>
<option value="中成药">中成药</option>
<option value="中药方剂">中药方剂</option>
<option value="其他">其他</option>
</select>
<label>药品名称</label>
<input id="drugName" placeholder="通用药品名称">

<label>规格</label>
<input id="spec" placeholder="例如：0.25g*6片">

<label>单位</label>
<select id="unit">
<option value="">选择单位</option>
<option value="片">片</option>
<option value="瓶">瓶</option>
<option value="支">支</option>
<option value="袋">袋</option>
<option value="盒">盒</option>
<option value="ml">ml</option>
<option value="g">g</option>
</select>

<label>单价</label>
<input type="number" step="0.01" id="price" placeholder="单价">
</div>

<div class="form-row">
<label>默认用法</label>
<select id="dosageSel">
    <option value="">选择剂量</option>
    <option value="1粒">1粒</option>
    <option value="2粒">2粒</option>
    <option value="3粒">3粒</option>
    <option value="1片">1片</option>
    <option value="2片">2片</option>
    <option value="1支">1支</option>
    <option value="1袋">1袋</option>
    <option value="5ml">5ml</option>
    <option value="10ml">10ml</option>
</select>

<select id="freqSel">
    <option value="">选择频次</option>
    <option value="每日1次">每日1次</option>
    <option value="每日2次">每日2次</option>
    <option value="每日3次">每日3次</option>
</select>

<select id="waySel">
    <option value="">选择给药方式</option>
    <option value="口服">口服</option>
    <option value="肌注">肌注</option>
    <option value="静滴">静滴</option>
    <option value="滴眼">滴眼</option>
    <option value="外用">外用</option>
    <option value="含服">含服</option>
    <option value="静脉推注">静脉推注</option>
</select>

<button id="saveBtn" onclick="addDrug()">新增保存药品</button>
<button class="btn-reset" onclick="resetDefaultDrug()">恢复预置基础药品</button>
<!-- 隐藏变量：当前正在编辑的下标，为空代表新增 -->
<input type="hidden" id="editIndex" value="">
</div>

<table>
<thead>
<tr>
<th>分类</th>
<th>药品名称</th>
<th>规格</th>
<th>单位</th>
<th>单价</th>
<th>默认用法</th>
<th>操作</th>
</tr>
</thead>
<tbody id="drugTable"></tbody>
</table>
</section>

<script>

let loginInfo = localStorage.getItem("loginUser");
if(!loginInfo){
alert("请登录系统！");
location.href="index.html";
}

    {type:"其他", name:"地塞米松磷酸钠注射液", spec:"1ml:5mg*10支", unit:"盒", price:"2.30", defaultUsage:"1支 每日1次 静滴"},
    {type:"其他", name:"维生素B6注射液", spec:"2ml:0.1g*10支", unit:"盒", price:"1.90", defaultUsage:"1支 每日1次 静滴"},
    {type:"其他", name:"胞磷胆碱钠注射液", spec:"2ml:0.25g*10支", unit:"盒", price:"6.90", defaultUsage:"2支 每日1次 静滴"},
    {type:"其他", name:"非那雄胺片", spec:"5mg*30片", unit:"盒", price:"7.36", defaultUsage:"1片 每日1次 口服"}

window.onload = function(){
    // 首次打开时，若没有药品数据则加载预置药品
    let existing = localStorage.getItem("medicineList");
    if(!existing || JSON.parse(existing).length === 0){
        localStorage.setItem("medicineList", JSON.stringify(defaultDrugs));
    }
    renderTable();
}

/**
 * 恢复预置基础药品按钮
 * 警告：会覆盖全部现有药品，自定义新增会丢失
 */
function resetDefaultDrug(){
    const ok = confirm("⚠️警告：此操作将覆盖当前全部药品清单，恢复为出厂预置药品，您自定义新增的药品会全部丢失！确定继续吗？");
    if(!ok) return;
    localStorage.setItem("medicineList", JSON.stringify(defaultDrugs));
    renderTable();
    alert("已恢复预置基础药品！");
}

//渲染药品表格
function renderTable(){
let list = JSON.parse(localStorage.getItem("medicineList")||"[]");
let tb = document.getElementById("drugTable");
tb.innerHTML="";
list.forEach((item,idx)=>{
let tr = document.createElement("tr");
tr.innerHTML=`
<td>${item.type}</td>
<td>${item.name}</td>
<td>${item.spec}</td>
<td>${item.unit}</td>
<td>${item.price}</td>
<td>${item.defaultUsage}</td>
<td>
<button onclick="editItem(${idx})">编辑</button>
<button class="btn-del" onclick="del(${idx})">删除</button>
</td>
`;
tb.appendChild(tr);
})
}

//【编辑功能：点击编辑，回填表单】
function editItem(index){
let list = JSON.parse(localStorage.getItem("medicineList")||"[]");
let data = list[index];

//回填基础信息
document.getElementById("drugType").value = data.type;
document.getElementById("drugName").value = data.name;
document.getElementById("spec").value = data.spec;
document.getElementById("unit").value = data.unit;
document.getElementById("price").value = data.price;

//拆分用法字符串 "2粒 每日1次 口服"
let usageArr = data.defaultUsage.split(" ");
if(usageArr.length ===3){
    document.getElementById("dosageSel").value = usageArr[0];
    document.getElementById("freqSel").value = usageArr[1];
    document.getElementById("waySel").value = usageArr[2];
}

//标记当前为编辑模式，记录下标
document.getElementById("editIndex").value = index;
document.getElementById("saveBtn").innerText = "保存修改";
//页面滚动到顶部表单区域
window.scrollTo(0,0);
}

//新增 / 统一保存入口（区分新增和编辑）
function addDrug(){
const editIndex = document.getElementById("editIndex").value;
const type = document.getElementById('drugType').value;
const name = document.getElementById('drugName').value.trim();
const spec = document.getElementById('spec').value.trim();
const unit = document.getElementById('unit').value;
const price = document.getElementById('price').value.trim();

const dosage = document.getElementById("dosageSel").value;
const freq = document.getElementById("freqSel").value;
const way = document.getElementById("waySel").value;

//校验
if(!name){alert("请填写药品名称！");return;}
if(!unit){alert("请选择单位！");return;}
if(!dosage || !freq || !way){
    alert("请完整选择【剂量、频次、给药方式】！");
    return;
}
const defaultUsage = `${dosage} ${freq} ${way}`;

let drugList = JSON.parse(localStorage.getItem("medicineList")||"[]");

if(editIndex === ""){
    //新增模式
    drugList.push({type,name,spec,unit,price,defaultUsage});
}else{
    //编辑模式：覆盖原有数据
    let idx = parseInt(editIndex);
    drugList[idx] = {type,name,spec,unit,price,defaultUsage};
}

localStorage.setItem("medicineList",JSON.stringify(drugList));

//清空表单、恢复新增状态
clearForm();
renderTable();
alert(editIndex === "" ? "药品新增成功！" : "药品修改成功！");
}

//清空所有输入框，重置为新增模式
function clearForm(){
document.getElementById('drugName').value = "";
document.getElementById('spec').value = "";
document.getElementById('unit').value = "";
document.getElementById('price').value = "";
document.getElementById("dosageSel").value = "";
document.getElementById("freqSel").value = "";
document.getElementById("waySel").value = "";
document.getElementById("editIndex").value = "";
document.getElementById("saveBtn").innerText = "新增保存药品";
}

//删除药品
function del(index){
if(!confirm("确定删除该药品吗？删除后无法恢复！")) return;
let list = JSON.parse(localStorage.getItem("medicineList")||"[]");
list.splice(index,1);
localStorage.setItem("medicineList",JSON.stringify(list));
renderTable();
}
</script>
</body>
</html>
