<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>药品目录维护</title>
<style>
*{margin:0;padding:0;font-family:"微软雅黑"}
header{background:#225494;color:#fff;padding:14px;font-size:19px;display:flex;justify-content:space-between}
section{padding:20px;max-width:1200px;margin:0 auto}

/* 顶部筛选区域 */
.search-area{
    background:#f6f7f9;
    padding:12px 14px;
    border-radius:5px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}
.search-area label{font-weight:bold;}

.form-row{margin:12px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{padding:6px;border:1px solid #aaa;font-size:14px}
table{width:100%;border-collapse:collapse;margin:20px 0}
th,td{border:1px solid #999;padding:8px;text-align:center;font-size:14px}
th{background:#f0f4f9;}

/* 普通主按钮：直角方形 */
button{
    padding:7px 10px;
    cursor:pointer;
    border:none;
    background:#225494;
    color:#fff;
    border-radius:3px;
    margin:0 2px
}
/* 表格单行删除按钮：白底黑字黑边框 */
.btn-del{
    background:#ffffff !important;
    color:#000000 !important;
    border:1px solid #000 !important;
}
.btn-reset{background:#c27000}
.btn-gray{background:#666666}

/* 批量删除入口按钮：白底黑字黑框 直角 */
.btn-batch{
    background:#ffffff;
    color:#000000;
    border:1px solid #000000 !important;
}

/* =====批量工具栏按钮：圆角样式，素雅浅色，和主按钮区分开===== */
.batch-btn{
    background:#ffffff;
    color:#222;
    border:1px solid #777;
    border-radius:20px !important;
}
.batch-btn-danger{
    background:#fff;
    color:#b32424;
    border:1px solid #b32424;
    border-radius:20px !important;
}

.back{cursor:pointer}
</style>
</head>
<body>
<header>

<span class="back" onclick="history.back()">返回主页</span>
</header>
<section>
<!-- 顶部筛选区域 -->
<div class="search-area">

        <option value="解热镇痛">解热镇痛</option>
        <option value="内分泌">内分泌</option>
        <option value="外用">外用</option>
        <option value="中成药">中成药</option>
        <option value="其他">其他</option>
    </select>
    <label>药品名称搜索：</label>
    <input id="filterName" placeholder="输入药品名称模糊查询">
    <button class="btn-gray" onclick="resetFilter()">重置筛选</button>
</div>

<div class="form-row">
<label>药品分类</label>
<select id="drugType">
<option value="抗生素">抗生素</option>
<option value="心血管">心血管</option>
<option value="呼吸消化">呼吸消化</option>
<option value="解热镇痛">解热镇痛</option>
<option value="内分泌">内分泌</option>
<option value="外用">外用</option>
<option value="中成药">中成药</option>
<option value="其他">其他</option>
</select>
<label>药品名称</label>
<input id="drugName" placeholder="通用药品名称">

<label>规格</label>
<input id="spec" placeholder="例如：0.25g*6片">

<label>单位</label>
<select id="unit">
<option value="">选择单位</option>
<option value="片">片</option>
<option value="瓶">瓶</option>
<option value="支">支</option>
<option value="袋">袋</option>
<option value="盒">盒</option>
<option value="ml">ml</option>
<option value="g">g</option>
<option value="丸">丸</option>
</select>

<label>单价</label>
<input type="number" step="0.01" id="price" placeholder="单价">
</div>

<div class="form-row">
<label>默认用法</label>
<input list="dosageList" id="dosageSel" placeholder="剂量，可手动输入">
<datalist id="dosageList">
    <option value="1粒">1粒</option>
    <option value="1片">1片</option>
    <option value="1支">1支</option>
    <option value="1袋">1袋</option>
    <option value="5ml">5ml</option>
    <option value="10ml">10ml</option>
    <option value="1丸">1丸</option>
</datalist>

<select id="freqSel">
    <option value="">选择频次</option>
    <option value="每日1次">每日1次</option>
    <option value="每日2次">每日2次</option>
    <option value="每日3次">每日3次</option>
</select>

<select id="waySel">
    <option value="">选择给药方式</option>
    <option value="口服">口服</option>
    <option value="肌注">肌注</option>
    <option value="静滴">静滴</option>

    <option value="外用">外用</option>
    <option value="含服">含服</option>
    <option value="静脉推注">静脉推注</option>
</select>

<button id="saveBtn" onclick="addDrug()">新增保存药品</button>
<button onclick="clearForm()">清空表单</button>
<button class="btn-reset" onclick="resetDefaultDrug()">恢复预置基础药品</button>
<button class="btn-batch" onclick="openBatchMode()">批量删除</button>
<input type="hidden" id="editIndex" value="">
</div>

<!-- 批量操作按钮栏（默认隐藏） -->
<div id="batchBar" style="margin:8px 0;display:none;">
    <button class="batch-btn" onclick="selectAll()">全选</button>
    <button class="batch-btn" onclick="cancelSelectAll()">取消全选</button>
    <button class="batch-btn-danger" onclick="confirmBatchDel()">确认批量删除</button>
    <button class="batch-btn" onclick="closeBatchMode()">退出选择模式</button>
</div>

<table>

<th>分类</th>

</section>

window.onload = function(){
    let existing = localStorage.getItem("medicineList");
    if(!existing || JSON.parse(existing).length === 0){
        localStorage.setItem("medicineList", JSON.stringify(defaultDrugs));
    }
    renderTable();
    //筛选变更自动刷新表格
    document.getElementById("filterType").addEventListener("change",renderTable);
    document.getElementById("filterName").addEventListener("input",renderTable);
}

//重置筛选
function resetFilter(){
    document.getElementById("filterType").value = "";
    document.getElementById("filterName").value = "";
    renderTable();
}

function resetDefaultDrug(){
    const tipText = `说明：
只会补充系统预置清单内【当前缺少】的药品
✅ 不会删除您手动新增的药品
✅ 不会覆盖您修改过价格、用法的原有药品
仅新增缺失药品，确定执行？`;
    const ok = confirm(tipText);
    if(!ok) return;

    let localList = JSON.parse(localStorage.getItem("medicineList") || "[]");
    const existNameSet = new Set(localList.map(item=>item.name));
    defaultDrugs.forEach(baseDrug=>{
        if(!existNameSet.has(baseDrug.name)){
            localList.push(baseDrug);
        }
    });
    localStorage.setItem("medicineList", JSON.stringify(localList));
    //恢复预置后清空筛选
    document.getElementById("filterType").value = "";
    document.getElementById("filterName").value = "";
    renderTable();
    alert("执行完成！已补充清单内缺失的预置基础药品。");
}

//开启批量模式
function openBatchMode(){
    batchMode = true;
    document.getElementById("batchBar").style.display = "block";
    renderTable();
}
//关闭批量模式
function closeBatchMode(){
    batchMode = false;
    document.getElementById("batchBar").style.display = "none";
    renderTable();
}
//全选
function selectAll(){
    let ckList = document.querySelectorAll(".batch-checkbox");
    ckList.forEach(ck=>ck.checked=true);
}
//取消全选
function cancelSelectAll(){
    let ckList = document.querySelectorAll(".batch-checkbox");
    ckList.forEach(ck=>ck.checked=false);
}
//批量删除确认
function confirmBatchDel(){
    let ckList = document.querySelectorAll(".batch-checkbox:checked");
    if(ckList.length ===0){
        alert("请先勾选要删除的药品！");
        return;
    }
    if(!confirm(`确定删除选中的${ckList.length}条药品数据？删除无法恢复！`)){
        return;
    }
    //收集选中的原始下标，从后往前删防止索引错乱
    let delIndexArr = [];
    ckList.forEach(item=>{
        delIndexArr.push(parseInt(item.dataset.idx));
    })
    delIndexArr.sort((a,b)=>b-a);

    let allList = JSON.parse(localStorage.getItem("medicineList")||"[]");
    delIndexArr.forEach(idx=>{
        allList.splice(idx,1);
    });
    localStorage.setItem("medicineList",JSON.stringify(allList));
    renderTable();
    alert("批量删除完成！");
}

//渲染表格核心：先筛选 → 再按分类排序，同类药品聚拢
function renderTable(){
    let allList = JSON.parse(localStorage.getItem("medicineList")||"[]");
    const filterType = document.getElementById("filterType").value;
    const keyword = document.getElementById("filterName").value.trim().toLowerCase();

    //筛选条件
    let data = allList.filter(item=>{
        let matchType = !filterType || item.type === filterType;
        let matchName = !keyword || item.name.toLowerCase().includes(keyword);
        return matchType && matchName;
    });
    //按分类排序，相同分类排在一起
    data.sort((a,b)=>{
        if(a.type > b.type) return 1;
        if(a.type < b.type) return -1;
        return 0;
    });

    //修改表头
    let headTr = document.getElementById("tableHeadTr");
    if(batchMode){
        headTr.innerHTML = `<th>选择</th><th>分类</th><th>药品名称</th><th>规格</th><th>单位</th><th>单价</th><th>默认用法</th><th>操作</th>`;
    }else{
        headTr.innerHTML = `<th>分类</th><th>药品名称</th><th>规格</th><th>单位</th><th>单价</th><th>默认用法</th><th>操作</th>`;
    }

    let tb = document.getElementById("drugTable");
    tb.innerHTML="";
    data.forEach((item,idx)=>{
        //找到原始数组下标用于编辑删除
        const realIndex = allList.findIndex(x=>x.name === item.name && x.spec === item.spec);
        let tr = document.createElement("tr");
        if(batchMode){
            tr.innerHTML=`
<td><input type="checkbox" class="batch-checkbox" data-idx="${realIndex}"></td>
<td>${item.type}</td>
<td>${item.name}</td>
<td>${item.spec}</td>
<td>${item.unit}</td>
<td>${item.price}</td>
<td>${item.defaultUsage}</td>
<td>
<button onclick="editItem(${realIndex})">编辑</button>
<button class="btn-del" onclick="del(${realIndex})">删除</button>
</td>
`;
        }else{
            tr.innerHTML=`
<td>${item.type}</td>
<td>${item.name}</td>
<td>${item.spec}</td>
<td>${item.unit}</td>
<td>${item.price}</td>
<td>${item.defaultUsage}</td>
<td>
<button onclick="editItem(${realIndex})">编辑</button>
<button class="btn-del" onclick="del(${realIndex})">删除</button>
</td>
`;
        }
        tb.appendChild(tr);
    })
}

function editItem(index){
let list = JSON.parse(localStorage.getItem("medicineList")||"[]");
let data = list[index];

document.getElementById("drugType").value = data.type;
document.getElementById("drugName").value = data.name;
document.getElementById("spec").value = data.spec;
document.getElementById("unit").value = data.unit;
document.getElementById("price").value = data.price;

let usageArr = data.defaultUsage.split(" ");
if(usageArr.length ===3){
    document.getElementById("dosageSel").value = usageArr[0];
    document.getElementById("freqSel").value = usageArr[1];
    document.getElementById("waySel").value = usageArr[2];
}

document.getElementById("editIndex").value = index;
document.getElementById("saveBtn").innerText = "保存修改";
window.scrollTo(0,0);
}

function addDrug(){
const editIndex = document.getElementById("editIndex").value;
const type = document.getElementById('drugType').value;
const name = document.getElementById('drugName').value.trim();
const spec = document.getElementById('spec').value.trim();
const unit = document.getElementById('unit').value;
const price = document.getElementById('price').value.trim();

const dosage = document.getElementById("dosageSel").value.trim();
const freq = document.getElementById("freqSel").value;
const way = document.getElementById("waySel").value;

if(!name){alert("请填写药品名称！");return;}
if(!unit){alert("请选择单位！");return;}
if(!dosage || !freq || !way){
    alert("请完整填写【剂量、频次、给药方式】！");
    return;
}
const defaultUsage = `${dosage} ${freq} ${way}`;

let drugList = JSON.parse(localStorage.getItem("medicineList")||"[]");

if(editIndex === ""){
    drugList.push({type,name,spec,unit,price,defaultUsage});
}else{
    let idx = parseInt(editIndex);
    drugList[idx] = {type,name,spec,unit,price,defaultUsage};
}

localStorage.setItem("medicineList",JSON.stringify(drugList));
clearForm();
renderTable();
alert(editIndex === "" ? "药品新增成功！" : "药品修改成功！");
}

function clearForm(){
document.getElementById('drugName').value = "";
document.getElementById('spec').value = "";
document.getElementById('unit').value = "";
document.getElementById('price').value = "";
document.getElementById("dosageSel").value = "";
document.getElementById("freqSel").value = "";
document.getElementById("waySel").value = "";
document.getElementById("editIndex").value = "";
document.getElementById("saveBtn").innerText = "新增保存药品";
}

function del(index){
if(!confirm("确定删除该药品吗？删除后无法恢复！")) return;
let list = JSON.parse(localStorage.getItem("medicineList")||"[]");
list.splice(index,1);
localStorage.setItem("medicineList",JSON.stringify(list));
renderTable();
}
</script>
