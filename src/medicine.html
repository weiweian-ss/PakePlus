<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>药品目录维护</title>
<style>
*{margin:0;padding:0;font-family:"微软雅黑"}
header{background:#225494;color:#fff;padding:14px;font-size:19px;display:flex;justify-content:space-between}
section{padding:20px;max-width:1200px;margin:0 auto}
.form-row{margin:12px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{padding:6px;border:1px solid #aaa;font-size:14px}
table{width:100%;border-collapse:collapse;margin:20px 0}
th,td{border:1px solid #999;padding:8px;text-align:center;font-size:14px}
button{padding:7px 12px;cursor:pointer;border:none;background:#225494;color:#fff;border-radius:3px}
.back{cursor:pointer}
</style>
</head>
<body>
<header>
<span>药品目录维护</span>
<span class="back" onclick="history.back()">返回主页</span>
</header>
<section>
<div class="form-row">
<label>药品分类</label>
<select id="drugType">
<option value="抗生素">抗生素</option>
<option value="输液">输液</option>
<option value="心血管">心血管</option>
<option value="呼吸消化">呼吸消化</option>
<option value="解热镇痛">解热镇痛</option>
<option value="内分泌">内分泌</option>
<option value="外用">外用</option>
<option value="中成药">中成药</option>
<option value="中药方剂">中药方剂</option>
<option value="其他">其他</option>
</select>
<label>药品名称</label>
<input id="drugName" placeholder="通用药品名称"></input>

<label>规格</label>
<input id="spec" placeholder="例如：0.25g*6片"></input>

<label>单位</label>
<input id="unit" placeholder="片/瓶/支"></input>

<label>单价</label>
<input type="number" step="0.01" id="price" placeholder="单价">
  </div>
<div class="form-row">
<label>默认用法</label>
<input style="width:420px" id="defaultUsage" placeholder="示例：2粒 每日1次 口服">
<button onclick="addDrug()">新增保存药品</button>
</div>  <table>
<thead>
<tr>
<th>分类</th>
<th>药品名称</th>
<th>规格</th>
<th>单位</th>
<th>单价</th>
<th>默认用法</th>
<th>操作</th>
</tr>
</thead>
<tbody id="drugTable"></tbody>
</table>
</section><script>
//=====【登录校验，请勿删除】=====
let loginInfo = localStorage.getItem("loginUser");
if(!loginInfo){
alert("请登录系统！");
location.href="index.html";
}

window.onload = function(){
renderTable();
}

//渲染药品表格
function renderTable(){
let list = JSON.parse(localStorage.getItem("medicineList")||"[]");
let tb = document.getElementById("drugTable");
tb.innerHTML="";
list.forEach((item,idx)=>{
let tr = document.createElement("tr");
tr.innerHTML=`
<td>${item.type}</td>
<td>${item.name}</td>
<td>${item.spec}</td>
<td>${item.unit}</td>
<td>${item.price}</td>
<td>${item.defaultUsage}</td>
<td><button onclick="del(${idx})">删除</button></td>
`;
tb.appendChild(tr);
})
}

//新增药品保存到本地存储
function addDrug(){
const type = document.getElementById('drugType').value;
const name = document.getElementById('drugName').value.trim();
const spec = document.getElementById('spec').value.trim();
const unit = document.getElementById('unit').value.trim();
const price = document.getElementById('price').value.trim();
const defaultUsage = document.getElementById('defaultUsage').value.trim();

if(!name){alert("请填写药品名称！");return;}

let drugList = JSON.parse(localStorage.getItem("medicineList")||"[]");
drugList.push({type,name,spec,unit,price,defaultUsage});
localStorage.setItem("medicineList",JSON.stringify(drugList));

//清空输入框
document.getElementById('drugName').value = "";
document.getElementById('spec').value = "";
document.getElementById('unit').value = "";
document.getElementById('price').value = "";
document.getElementById('defaultUsage').value = "";
renderTable();
alert("药品录入成功，开具处方页面可以调用！");
}

//删除药品
function del(index){
let list = JSON.parse(localStorage.getItem("medicineList")||"[]");
list.splice(index,1);
localStorage.setItem("medicineList",JSON.stringify(list));
renderTable();
}
</script></body>
</html>
