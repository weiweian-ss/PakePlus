<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>系统主页</title>
<style>
*{margin:0;padding:0;font-family:"微软雅黑"}
header{background:#225494;color:#fff;padding:16px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.logout{font-size:14px;cursor:pointer;padding:6px 10px;border:1px solid #fff;border-radius:4px}
.container{padding:30px;max-width:900px;margin:0 auto}
.btnbox{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:30px}
.nav-btn{padding:30px;text-align:center;border:1px solid #225494;color:#225494;border-radius:8px;font-size:18px;cursor-pointer}
.nav-btn:hover{background:#225494;color:#fff}
</style>
</head>
<body>
<header>
  <span id="welcome">XX村卫生室 | 电子处方管理系统</span>
  <span class="logout" onclick="logout()">退出登录</span>
</header>
<div class="container">
  <div class="btnbox">
    <div class="nav-btn" onclick="location.href='patient.html'">患者档案管理</div>
    <div class="nav-btn" onclick="location.href='medicine.html'">药品目录维护</div>
    <div class="nav-btn" onclick="location.href='prescription.html'">开具电子处方</div>
    <div class="nav-btn" onclick="location.href='search.html'">处方查询与打印</div>
  </div>
</div>

<script>
//登录检测
let loginInfo = localStorage.getItem("loginUser");
if(!loginInfo){
  alert("请先登录系统！");
  location.href="index.html";
}else{
  let user = JSON.parse(loginInfo);
  document.getElementById("welcome").innerText = `XX村卫生室 | 欢迎您：${user.name}`;
}
//退出登录
function logout(){
  localStorage.removeItem("loginUser");
  location.href="index.html";
}
</script>
</body>
</html>
