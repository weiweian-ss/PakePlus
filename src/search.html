<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>处方记录查询系统</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"SimSun", "宋体";
}
body{
  background:#efefef;
  padding:20px;
}
.wrap{
  max-width:1200px;
  margin:0 auto;
}
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
  flex-wrap:wrap;
  gap:10px;
}
h1{
  font-size:22px;
  color:#222;
}
.tool-bar{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
#keyword{
  padding:9px 12px;
  font-size:15px;
  border:1px solid #bbb;
  border-radius:4px;
  width:260px;
}
button{
  padding:8px 16px;
  cursor:pointer;
  border:1px solid #999;
  border-radius:3px;
}
.btn-blue{
  background:#0275d8;
  color:#fff;
  border-color:#0275d8;
}
.btn-red{
  background:#d9534f;
  color:#fff;
  border-color:#d9534f;
}
.btn-green{
  background:#28a745;
  color:#fff;
  border-color:#28a745;
}
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}
th,td{
  border:1px solid #ccc;
  padding:10px;
  font-size:14px;
}
th{
  background:#f5f5f5;
}
.operate-btn{
  display:flex;
  gap:4px;
}
.empty{
  text-align:center;
  padding:40px;
  font-size:16px;
  color:#666;
}
.modal-mask{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.modal-box{
  width:760px;
  max-height:85vh;
  overflow-y:auto;
  background:#fff;
  padding:24px;
  border-radius:6px;
}
.modal-title{
  font-size:18px;
  margin-bottom:14px;
  padding-bottom:8px;
  border-bottom:1px solid #ddd;
}
.content-block{
  line-height:1.8;
  white-space:pre-line;
  font-size:15px;
}
.modal-footer{
  margin-top:16px;
  text-align:right;
}

.print-area{
  display:none;
}

/* =========【完全复制 pres_print.txt 的处方样式】========= */
.pres-card {
  width:148mm;
  height:210mm;
  border:1px solid #333;
  margin:0 auto;
  padding:12mm;
  position:relative;
}
.pres-title{
  text-align:center;
  font-size:19px;
  font-weight:normal;
  margin-bottom:4px;
}
.title-divider {
  width:100%;
  height:1px;
  background:#000;
  margin-bottom:10px;
}
.info-line {
  font-size:14px;
  line-height:32px;
  white-space:nowrap;
}
.info-line .fake-input{
  display:inline-block;
  border:none;
  border-bottom:1px solid #000;
  background:transparent;
  font-size:14px;
}
.bottom-block .fake-input {
  border: none !important;
  border-bottom: 1px solid #000 !important;
  background: transparent;
}
.rx-divider {
  width:100%;
  height:1px;
  background:#000;
  margin:16px 0 4px 0;
}
.rp-sign {
  font-size:40px;
}
.drug-text-area{
  font-size:14px;
  line-height:28px;
  min-height:62mm;
  white-space:pre-line;
}
.bottom-block{
  position:absolute;
  left:12mm;
  right:12mm;
  bottom:12mm;
}
.doc-line{
  font-size:14px;
  line-height:32px;
  margin-bottom:4px;
}
.doc-divider {
  width:100%;
  height:1px;
  background:#000;
  margin-bottom:6px;
}
.bottom-row {
  display:flex;
  justify-content:space-between;
  font-size:14px;
  line-height:32px;
}

/* =========打印配置【照搬定稿版】========= */
@media print{
  .wrap,.modal-mask{
    display:none !important;
  }
  body{
    padding:0 !important;
    margin:0 !important;
    background:#fff !important;
  }
  .print-area{
    display:block !important;
  }
  .pres-card{
    border:none !important;
    width:136mm !important;
    height:198mm !important;
  }
  .pres-card * {
    page-break-inside: avoid !important;
    page-break-after: avoid !important;
    page-break-before: avoid !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  .pres-card{
    page-break-after:always !important;
  }
  .pres-card:last-child{
    page-break-after:avoid !important;
  }
  @page {
    size:A5 portrait;
    margin:6mm !important;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <h1>处方记录查询</h1>
    <button onclick="location.href='main.html'">← 返回系统主页面</button>
  </div>
  <div class="tool-bar">
    <input id="keyword" placeholder="输入患者姓名检索处方..." oninput="renderList()">
    <button class="btn-blue" onclick="renderList()">搜索</button>
    <button onclick="selectAll()">全选/取消全选</button>
    <button class="btn-green" onclick="batchPrint()">🖨批量打印选中处方</button>
  </div>
  <table>
    <thead>
      <tr>
        <th width="60">勾选</th>
        <th width="160">日期</th>
        <th width="140">姓名</th>
        <th width="90">性别</th>
        <th width="90">年龄</th>
        <th>临床诊断</th>
        <th width="160">操作</th>
      </tr>
    </thead>
    <tbody id="tableBody">
    </tbody>
  </table>
</div>

<div class="print-area" id="printContainer"></div>

<div class="modal-mask" id="modal">
  <div class="modal-box">
    <div class="modal-title">处方完整详情</div>
    <div class="content-block" id="detailContent"></div>
    <div class="modal-footer">
      <button onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<script>
let allRecordList = [];
let showIndex = null;
let selectAllFlag = false;

window.onload = function(){
  loadData();
  renderList();
}

function loadData(){
  allRecordList = JSON.parse(localStorage.getItem("prescriptionRecords") || "[]");
  allRecordList.reverse();
}

function renderList(){
  const key = document.getElementById("keyword").value.trim();
  const tbody = document.getElementById("tableBody");
  let html = "";
  let filterData = allRecordList;
  if(key){
    filterData = allRecordList.filter(item=>{
      return item.patientName.includes(key);
    })
  }
  if(filterData.length === 0){
    tbody.innerHTML = `<tr><td colspan="7" class="empty">暂无匹配处方记录</td></tr>`;
    return;
  }
  filterData.forEach((item,idx)=>{
    html += `
    <tr data-index="${idx}">
      <td><input type="checkbox" class="chk-item" data-idx="${idx}"></td>
      <td>${item.createDate}</td>
      <td>${item.patientName}</td>
      <td>${item.sex}</td>
      <td>${item.age}</td>
      <td>${item.diagnosis}</td>
      <td class="operate-btn">
        <button class="btn-blue" onclick="viewDetail(${idx})">查看详情</button>
        <button class="btn-red" onclick="delRecord(${idx})">删除</button>
      </td>
    </tr>
    `;
  })
  tbody.innerHTML = html;
}

function selectAll(){
  selectAllFlag = !selectAllFlag;
  document.querySelectorAll(".chk-item").forEach(ck=>{
    ck.checked = selectAllFlag;
  })
}

function viewDetail(idx){
  showIndex = idx;
  const data = allRecordList[idx];
  const html = `
乡：${data.town||""}　村：${data.village||""}
姓名：${data.patientName}　性别：${data.sex}　年龄：${data.age}
联系电话：${data.tel||""}
科别：${data.depart||""}
诊断：${data.diagnosis||""}
开具日期：${data.createDate}

【药品清单】
${data.drugContent}
`;
  document.getElementById("detailContent").innerText = html;
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function delRecord(idx){
  if(!confirm("确认永久删除这条处方记录？删除无法恢复！")) return;
  allRecordList.splice(idx,1);
  localStorage.setItem("prescriptionRecords",JSON.stringify(allRecordList));
  renderList();
}

function batchPrint(){
  const checkedItems = document.querySelectorAll(".chk-item:checked");
  if(checkedItems.length === 0){
    alert("请先勾选需要打印的处方！");
    return;
  }
  let printHtml = "";
  checkedItems.forEach(ck=>{
    const idx = ck.getAttribute("data-idx");
    const data = allRecordList[idx];
    const moneyVal = (data.totalMoney && data.totalMoney !== "0.00") ? data.totalMoney : "";

    printHtml += `
<div class="pres-card">
    <div class="pres-title">辛庄中心卫生院一体化村卫生室专用处方笺</div>
    <div class="title-divider"></div>

    <div class="info-line">
        <span class="fake-input" style="width:70px;">${data.town||"辛庄"}</span>乡
        <span class="fake-input" style="width:70px;">${data.village||""}</span>村
        &nbsp;&nbsp;&nbsp;电话：<span class="fake-input" style="width:100px;">${data.tel||""}</span>
    </div>

    <div class="info-line" style="display:flex;justify-content:space-between;">
        <span>姓名：<span class="fake-input" style="width:110px;">${data.patientName||""}</span></span>
        <span>性别：<span class="fake-input" style="width:70px;">${data.sex||""}</span></span>
        <span>年龄：<span class="fake-input" style="width:70px;">${data.age||""}</span></span>
    </div>

    <div class="info-line" style="display:flex; justify-content:space-between; align-items:center;">
        <span>科别：<span class="fake-input" style="width:65px;">${data.depart||""}</span></span>
        <span>临床诊断：<span class="fake-input" style="width:110px;">${data.diagnosis||""}</span></span>
        <span>日期：<span class="fake-input" style="width:70px;">${data.createDate||""}</span></span>
    </div>

    <div class="rx-divider"></div>
    <div class="rp-sign">Rp</div>
    <div class="drug-text-area">${data.drugContent}</div>

    <div class="bottom-block">
        <div class="doc-line">医师签名：<span class="fake-input" style="width:220px;">韩卫</span></div>
        <div class="doc-divider"></div>
        <div class="bottom-row">
            <span>药品金额<span class="fake-input" style="width:90px;">${moneyVal}</span></span>
            <span>审核<span class="fake-input" style="width:70px;"></span></span>
            <span>调配<span class="fake-input" style="width:70px;"></span></span>
            <span>核对<span class="fake-input" style="width:70px;"></span></span>
        </div>
    </div>
</div>
    `;
  });

  const printBox = document.getElementById("printContainer");
  printBox.innerHTML = printHtml;

  const printFinish = function(){
    printBox.innerHTML = "";
    window.removeEventListener("afterprint", printFinish);
  };
  window.addEventListener("afterprint", printFinish);

  setTimeout(()=>{
    window.print();
  }, 350);
}
</script>
</body>
</html>
