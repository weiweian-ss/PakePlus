<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>患者档案</title>
<style>
*{margin:0;padding:0;font-family:"微软雅黑"}
header{background:#225494;color:#fff;padding:14px;font-size:19px;display:flex;justify-content:space-between}
section{padding:20px;max-width:900px}
.row{margin:12px 0}
label{display:inline-block;width:100px}
input{padding:6px;width:260px}
button{padding:7px 14px}
.back{cursor:pointer}
</style>
</head>
<body>
<header>
  <span>新建患者档案</span>
  <span class="back" onclick="history.back()">返回主页</span>
</header>
<section>
  <div class="row">
    <label>姓名</label>
    <input id="name">
  </div>
  <div class="row">
    <label>性别</label>
    <input id="sex">
  </div>
  <div class="row">
    <label>年龄</label>
    <input id="age">
  </div>
  <div class="row">
    <label>手机号</label>
    <input id="phone">
  </div>
  <div class="row">
    <label>住址</label>
    <input id="addr">
  </div>
  <div class="row">
    <label>药物过敏史</label>
    <input id="allergy">
  </div>
  <br>
  <button onclick="alert('患者信息保存成功')">保存档案</button>
</section>
</body>
</html>
